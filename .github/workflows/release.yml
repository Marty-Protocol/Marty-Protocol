name: Release protocol bindings

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Validate versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(python -c "import tomllib; print(tomllib.load(open('reference/python/pyproject.toml','rb'))['project']['version'])")" = "$version"
          test "$(node -p "require('./reference/typescript/package.json').version")" = "$version"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' reference/rust/Cargo.toml | head -1)" = "$version"
      - name: Build Python distributions
        run: python -m pip install build && python -m build reference/python
      - name: Build npm tarball
        working-directory: reference/typescript
        run: npm ci --ignore-scripts && npm run build && mkdir -p dist-release && npm pack --pack-destination dist-release
      - name: Build Rust crate
        working-directory: reference/rust
        run: cargo package
      - name: Collect evidence
        run: |
          mkdir -p release/python release/npm release/rust
          cp reference/python/dist/* release/python/
          cp reference/typescript/dist-release/*.tgz release/npm/
          cp reference/rust/target/package/*.crate release/rust/
          find release -type f -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-release
          path: release
          retention-days: 7

  publish-python:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protocol-release
          path: release
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release/python

  publish-npm:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - working-directory: reference/typescript
        run: npm ci --ignore-scripts && npm publish

  publish-rust:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - working-directory: reference/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protocol-release
          path: release
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/**/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/**/*
          generate_release_notes: true
