name: Release protocol bindings

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Validate versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(python -c "import tomllib; print(tomllib.load(open('reference/python/pyproject.toml','rb'))['project']['version'])")" = "$version"
          test "$(node -p "require('./reference/typescript/package.json').version")" = "$version"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' reference/rust/Cargo.toml | head -1)" = "$version"
      - name: Build Python distributions
        run: python -m pip install build && python -m build reference/python
      - name: Build npm tarball
        working-directory: reference/typescript
        run: npm ci --ignore-scripts && npm run build && mkdir -p dist-release && npm pack --pack-destination dist-release
      - name: Build Rust crate
        working-directory: reference/rust
        run: cargo package
      - name: Collect evidence
        run: |
          mkdir -p release/python release/npm release/rust
          cp reference/python/dist/* release/python/
          cp reference/typescript/dist-release/*.tgz release/npm/
          cp reference/rust/target/package/*.crate release/rust/
          find release -type f -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-release
          path: release
          retention-days: 7

  publish-python:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protocol-release
          path: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/python

  publish-npm:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - working-directory: reference/typescript
        run: npm ci --ignore-scripts && npm publish

  publish-rust:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - working-directory: reference/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protocol-release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/**/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/**/*
          generate_release_notes: true
