name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Schema Validation & Conformance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Verify generated bindings
        run: uv run python scripts/codegen.py --check

  lint-json:
    name: JSON Schema Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate schemas are well-formed JSON
        run: |
          for f in schemas/*.json enums/*.json; do
            python3 -c "import json, sys; json.load(open('$f'))" || exit 1
          done
          echo "All JSON files are well-formed."

      - name: Build generated TypeScript bindings
        working-directory: reference/typescript
        run: npm ci --ignore-scripts && npm run build

  dco-check:
    name: DCO Sign-off Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while read -r commit; do
            author_email="$(git show -s --format='%ae' "$commit")"
            signoffs="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")"
            if ! grep -Fqi "<$author_email>" <<<"$signoffs"; then
              echo "::error::Commit $commit is missing a Signed-off-by trailer for $author_email"
              failed=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
