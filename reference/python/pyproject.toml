[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mip-protocol-types"
version = "0.4.1"
description = "Generated Python types for the Marty Identity Protocol"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Marty-Protocol/Marty-Protocol"
Repository = "https://github.com/Marty-Protocol/Marty-Protocol.git"
Issues = "https://github.com/Marty-Protocol/Marty-Protocol/issues"

[project.optional-dependencies]
dev = ["mypy>=1.0", "pytest>=7.0"]
